<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E2F5E" />
    <title>Offline — CertifyHub</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 55%, #eef2f7 100%);
        color: #0f172a;
      }
      .card {
        width: 100%;
        max-width: 460px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        padding: 32px;
        box-shadow: 0 18px 40px -20px rgba(15, 23, 42, 0.3);
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        background: #0e2f5e0f;
        color: #0e2f5e;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 8px 14px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: #475569;
        font-size: 15px;
        line-height: 1.7;
      }
      button {
        margin-top: 24px;
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: #2660a4;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        padding: 14px 20px;
        cursor: pointer;
      }
      button:hover {
        background: #1f4f8d;
      }
      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">CertifyHub</span>
      <h1>You are offline</h1>
      <p>
        Your connection dropped. Lessons already opened are safe — reconnect
        and pick up where you left off.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint">
        Practice banks and scores need a connection so your progress stays in
        sync.
      </p>
    </main>
  </body>
</html>
